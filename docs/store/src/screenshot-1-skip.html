<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="base.css" />
    <style>
      body {
        width: 1280px;
        height: 800px;
        display: flex;
        align-items: center;
        gap: 96px;
        padding: 0 112px;
      }
      .text {
        flex: 1;
      }
      h1 {
        font-size: 64px;
        line-height: 1.1;
        margin-bottom: 28px;
      }
      p {
        font-size: 28px;
        line-height: 1.45;
      }
      p + p {
        margin-top: 20px;
      }
      img {
        width: 420px;
        border-radius: 16px;
        box-shadow: 0 24px 64px rgb(0 0 0 / 0.5);
      }
    </style>
  </head>
  <body>
    <div class="text">
      <h1>The Skip button,<br />clicked for you.</h1>
      <p class="muted">
        When a YouTube ad becomes skippable, it's skipped. No more watching the
        corner of the screen.
      </p>
      <p class="muted">
        Not an ad blocker: ads still start, and unskippable ads play.
      </p>
    </div>
    <img src="popup-light.png" alt="" />
  </body>
</html>
