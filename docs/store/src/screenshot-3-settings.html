<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="base.css" />
    <style>
      body {
        width: 1280px;
        height: 800px;
        display: flex;
        align-items: center;
        gap: 96px;
        padding: 0 112px;
      }
      img {
        width: 420px;
        border-radius: 16px;
        box-shadow: 0 24px 64px rgb(0 0 0 / 0.5);
      }
      h1 {
        font-size: 60px;
        line-height: 1.1;
        margin-bottom: 32px;
      }
      ul {
        list-style: none;
        padding: 0;
        font-size: 28px;
        line-height: 1.4;
      }
      li + li {
        margin-top: 22px;
      }
      b {
        color: var(--fg);
      }
    </style>
  </head>
  <body>
    <img src="popup-dark.png" alt="" />
    <div>
      <h1>Simple, and yours.</h1>
      <ul class="muted">
        <li><b>On or off</b> with one click.</li>
        <li><b>Delay</b> of 0–10 seconds, to glance at the ad first.</li>
        <li><b>Ads skipped</b> counter, kept only on this computer.</li>
        <li>Light and dark mode.</li>
      </ul>
    </div>
  </body>
</html>
