<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Skip Ad for YouTube</title>
    <link rel="stylesheet" href="popup.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <main>
      <h1>Skip Ad for YouTube</h1>
      <form class="settings">
        <div class="field">
          <label for="enabled">Auto-skip ads</label>
          <input id="enabled" name="enabled" type="checkbox" />
        </div>
        <div class="field">
          <label for="delay">Delay (seconds)</label>
          <input
            id="delay"
            name="delay"
            type="number"
            min="0"
            max="10"
            step="1"
            inputmode="numeric"
          />
        </div>
      </form>
      <section class="counter">
        <div class="field">
          <label for="skip-count">Ads skipped:</label>
          <output id="skip-count"></output>
        </div>
        <button id="reset-count" type="button">Reset counter</button>
      </section>
      <aside
        id="rate-prompt"
        class="rate-prompt"
        aria-label="Rating request"
        hidden
      >
        <p>
          <span id="rate-count"></span>+ ads skipped! A quick rating helps
          others find this.
        </p>
        <div class="rate-actions">
          <a
            id="rate-link"
            class="rate-link"
            data-store-reviews
            target="_blank"
            rel="noopener"
            >Rate it ★</a
          >
          <button id="rate-never" class="rate-never" type="button">
            Don't ask again
          </button>
          <button
            id="rate-dismiss"
            class="rate-dismiss"
            type="button"
            aria-label="Dismiss"
          >
            ×
          </button>
        </div>
      </aside>
    </main>
    <footer>
      <span class="privacy-note">🔒 No data collected</span>
      <a
        href="https://github.com/RabbiHasanR/yt-skip-ad/blob/main/PRIVACY.md"
        target="_blank"
        rel="noopener"
        >Privacy</a
      >
      <span aria-hidden="true">·</span>
      <a
        href="https://github.com/RabbiHasanR/yt-skip-ad"
        target="_blank"
        rel="noopener"
        title="Source code: star it on GitHub"
        >Source <span aria-hidden="true">★</span></a
      >
      <span aria-hidden="true">·</span>
      <a data-store-reviews target="_blank" rel="noopener">Rate</a>
    </footer>
  </body>
</html>
