<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>YT Skip Ad</title>
    <link rel="stylesheet" href="popup.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <main>
      <h1>YT Skip Ad</h1>
      <form class="settings">
        <div class="field">
          <label for="enabled">Auto-skip ads</label>
          <input id="enabled" name="enabled" type="checkbox" />
        </div>
        <div class="field">
          <label for="delay">Delay (seconds)</label>
          <input
            id="delay"
            name="delay"
            type="number"
            min="0"
            max="10"
            step="1"
            inputmode="numeric"
          />
        </div>
      </form>
      <section class="counter">
        <div class="field">
          <label for="skip-count">Ads skipped:</label>
          <output id="skip-count"></output>
        </div>
        <button id="reset-count" type="button">Reset counter</button>
      </section>
    </main>
    <footer>
      <span>🔒 No data collected</span>
      <span aria-hidden="true">·</span>
      <a
        href="https://github.com/RabbiHasanR/yt-skip-ad/blob/main/PRIVACY.md"
        target="_blank"
        rel="noopener"
        >Privacy</a
      >
      <span aria-hidden="true">·</span>
      <a
        href="https://github.com/RabbiHasanR/yt-skip-ad"
        target="_blank"
        rel="noopener"
        >Source</a
      >
    </footer>
  </body>
</html>
