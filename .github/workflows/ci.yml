# CI: every pull request to main, and every push to main, must pass the same
# checks as the local gate. `checks` and `e2e` are the required status checks
# in the `protect main` ruleset, so keep these job names.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# CI only reads the code; it never writes to the repo.
permissions:
  contents: read

# A newer push to the same PR or branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      # Proves the dist zip still builds with only extension files.
      - run: npm run package

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # On failure, keep traces and screenshots to see what broke.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
