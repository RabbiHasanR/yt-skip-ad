name: Feature idea
description: Suggest something the extension could do better.
title: '[Idea] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome! One promise never changes: the extension collects
        no data and makes no network requests, so ideas that need either
        can't be added.
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The problem or wish, in your own words.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could the extension help?
      description: Optional. Your idea of how it could work.
